<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI问答助手 - 虚拟人物</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶部导航 -->
        <header class="app-header">
            <div class="header-title">
                <span class="logo">🤖</span>
                <h1>AI问答助手</h1>
            </div>
            <div class="header-actions">
                <button id="assessmentBtn" class="btn btn-primary">📝 心理测评</button>
                <a href="/admin.html" class="btn btn-secondary admin-link" id="adminLink" style="display:none;">⚙️ 后台管理</a>
                <div class="user-info">
                    <span class="user-avatar" id="userAvatar">👤</span>
                    <span class="user-name" id="userName">用户</span>
                    <div class="user-dropdown">
                        <button class="dropdown-toggle" id="userMenuBtn">▼</button>
                        <div class="dropdown-menu" id="userMenu">
                            <a href="#" id="changePasswordBtn">🔒 修改密码</a>
                            <a href="#" id="logoutBtn">🚪 退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主体内容区 -->
        <main class="main-content">
            <!-- 左侧：数字人区域 -->
            <section class="digital-human-section">
                <div class="digital-human-container">
                    <img id="digitalHuman" src="assets/idle.gif" alt="数字人" class="digital-human-img" onerror="this.style.display='none';document.getElementById('digitalHumanFallback').style.display='flex';">
                    <div id="digitalHumanFallback" class="digital-human-fallback" style="display:none;">
                        <div class="avatar-character" id="avatarCharacter">
                            <div class="face">
                                <div class="eyes">
                                    <div class="eye"><div class="pupil"></div></div>
                                    <div class="eye"><div class="pupil"></div></div>
                                </div>
                                <div class="mouth" id="avatarMouth"></div>
                            </div>
                        </div>
                    </div>
                    <div class="speaking-indicator" id="speakingIndicator" style="display:none;">
                        <span class="pulse"></span>
                        <span>正在说话...</span>
                    </div>
                </div>
                <div class="digital-human-info">
                    <h3>AI心理助手</h3>
                    <p>有什么可以帮你的吗？</p>
                </div>
            </section>

            <!-- 右侧：聊天区域 -->
            <section class="chat-section">
                <div class="chat-header">
                    <h2>💬 对话区</h2>
                    <label class="voice-toggle">
                        <input type="checkbox" id="voiceToggle" checked>
                        <span>🔊 语音播报</span>
                    </label>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message ai-message welcome-message">
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">
                            <p>你好！我是AI心理助手，很高兴见到你。你可以问我任何问题，或者做个心理测评来了解自己的心理状态。</p>
                        </div>
                    </div>
                </div>

                <!-- 推荐问题 -->
                <div class="suggested-questions" id="suggestedQuestions">
                    <span class="suggest-label">💡 试试问我：</span>
                    <div class="suggest-tags" id="suggestTags"></div>
                </div>

                <!-- 输入区域 -->
                <div class="input-area">
                    <button id="voiceInputBtn" class="btn-icon voice-btn" title="语音输入">
                        🎤
                    </button>
                    <input type="text" id="messageInput" placeholder="请输入你的问题..." autocomplete="off">
                    <button id="sendBtn" class="btn-icon send-btn" title="发送">
                        ➤
                    </button>
                </div>
            </section>
        </main>

        <!-- 异常提示弹窗 -->
        <div class="modal-overlay" id="alertModal" style="display:none;">
            <div class="modal alert-modal">
                <div class="alert-icon">⚠️</div>
                <h2>安全提示</h2>
                <p id="alertMessage"></p>
                <p class="alert-hint">请关注用户的心理健康，必要时寻求专业帮助。</p>
                <button class="btn btn-primary" id="closeAlertBtn">我知道了</button>
            </div>
        </div>

        <!-- 心理测评弹窗 -->
        <div class="modal-overlay" id="assessmentModal" style="display:none;">
            <div class="modal assessment-modal">
                <div class="assessment-header">
                    <h2>📝 心理测评</h2>
                    <button class="close-btn" id="closeAssessmentBtn">✕</button>
                </div>
                <div class="assessment-type-select">
                    <label>选择测评量表：</label>
                    <select id="assessmentType">
                        <option value="depression">抑郁自评量表 (PHQ-9)</option>
                        <option value="anxiety">焦虑自评量表 (GAD-7)</option>
                    </select>
                </div>
                <div class="assessment-content" id="assessmentContent">
                    <p class="assessment-intro">请选择一个测评量表开始测试。这些量表可以帮助你了解自己的心理状态。</p>
                </div>
                <div class="assessment-footer" id="assessmentFooter" style="display:none;">
                    <button class="btn btn-secondary" id="prevQuestionBtn">上一题</button>
                    <span id="progressIndicator">1 / 9</span>
                    <button class="btn btn-primary" id="nextQuestionBtn">下一题</button>
                </div>
                <div class="assessment-result" id="assessmentResult" style="display:none;"></div>
                <div class="assessment-actions" id="assessmentActions">
                    <button class="btn btn-primary" id="startAssessmentBtn">开始测评</button>
                </div>
            </div>
        </div>

        <!-- 语音输入提示 -->
        <div class="voice-indicator" id="voiceIndicator" style="display:none;">
            <div class="voice-waves">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <p>正在聆听...</p>
        </div>

        <!-- 修改密码弹窗 -->
        <div class="modal-overlay" id="changePasswordModal" style="display:none;">
            <div class="modal password-modal">
                <div class="password-header">
                    <h2>🔒 修改密码</h2>
                    <button class="close-btn" id="closePasswordBtn">✕</button>
                </div>
                <form id="changePasswordForm" class="password-form">
                    <div class="form-group">
                        <label for="oldPassword">旧密码</label>
                        <input type="password" id="oldPassword" placeholder="请输入旧密码" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密码</label>
                        <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">确认新密码</label>
                        <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required minlength="6">
                    </div>
                    <div class="error-message" id="passwordError"></div>
                    <button type="submit" class="btn btn-primary" id="savePasswordBtn">保存修改</button>
                </form>
            </div>
        </div>

        <!-- 提示消息 -->
        <div class="toast" id="toast" style="display:none;"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
